# A template: the nginx image fills in ${API_BASE_URL} and ${BACKEND_URL} from the
# environment when the container starts (see the Dockerfile), so each deployment sets
# them without a code change. nginx's own $variables are left alone.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resumes are up to 5 MB.
    client_max_body_size 6m;

    # Where the app sends API calls: "/api" behind the proxy below (same origin, no CORS), or the
    # backend's own URL. index.html loads this before the app starts; `npm run dev` serves one too.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.__COVERLAY__ = { apiBaseUrl: '${API_BASE_URL}' };\n";
    }

    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An analysis that uses the AI engine can take a while.
        proxy_read_timeout 120s;
    }

    # Built files are named by their content, so they can be kept for a year; index.html must always be fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A single-page app: any address that is not a file (/builder, /applications) is the app, and the app routes it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
