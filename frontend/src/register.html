<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create account · Coverlay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="auth-wrap">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="logo.png" alt="" />
        Coverlay
      </a>

      <div class="card auth-card">
        <h1>Create your account</h1>
        <p class="sub">Free to start. Upload your resume right after.</p>

        <div id="signed-in" class="notice" hidden>
          <p>You're already signed in as <b id="signed-in-email"></b>.</p>
          <div class="row">
            <a class="btn btn-primary" href="dashboard.html">Go to dashboard</a>
            <button id="switch-account" class="btn btn-ghost" type="button">Use another account</button>
          </div>
        </div>

        <form id="register-form" novalidate>
          <div id="register-error" class="alert alert-error" role="alert" hidden></div>

          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" class="input" type="email" autocomplete="email" aria-describedby="register-email-error" />
            <p id="register-email-error" class="field-error"></p>
          </div>

          <div class="field">
            <label for="register-password">Password</label>
            <input id="register-password" class="input" type="password" autocomplete="new-password"
                   aria-describedby="register-password-hint register-password-error" />
            <p id="register-password-hint" class="field-hint">8 to 72 characters.</p>
            <p id="register-password-error" class="field-error"></p>
          </div>

          <div class="field">
            <label for="register-confirm-password">Confirm password</label>
            <input id="register-confirm-password" class="input" type="password" autocomplete="new-password"
                   aria-describedby="register-confirm-password-error" />
            <p id="register-confirm-password-error" class="field-error"></p>
          </div>

          <button id="register-submit" class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
      </div>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </main>

    <script type="module" src="js/pages/register.js"></script>
  </body>
</html>
