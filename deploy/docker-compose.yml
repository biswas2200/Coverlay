# Beta deployment: the whole stack on one VM (deploy/README.md).
#
#   cd deploy && docker compose up -d --build
#
# Only Caddy is reachable from outside (80/443, with an automatic HTTPS
# certificate for SITE_ADDRESS); everything else talks on the compose network.
# The pages call the backend at /api on the same address (frontend/nginx.conf),
# so no CORS is involved. Secrets come from deploy/.env (see .env.example),
# never from git. Google access (Gemini) is the VM's service account through
# the metadata server: no key file.
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_analyser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    # Docker Hub no longer serves MinIO's images, so this is the local stack's
    # minio/minio:latest (RELEASE.2025-09-07T16-13-09Z) copied to the VM with
    # docker save / docker load (deploy/README.md) and never pulled.
    image: coverlay/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in deploy/.env}
    volumes:
      - minio-data:/data

  ml-service:
    build: ../ml-service
    restart: unless-stopped
    environment:
      LLM_PROVIDER: gemini
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?set in deploy/.env}
      GOOGLE_CLOUD_LOCATION: global
      # One model per task tier (ml-service/app/config.py): resumes and Lay AI
      # chat on Flash-Lite, recruiter-facing documents on 3.8 Flash. Prices
      # and thinking levels per model: ml-service/app/services/model_catalog.py.
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_MODEL_EXTRACT: gemini-3.5-flash-lite
      GEMINI_MODEL_CHAT: gemini-3.5-flash-lite
      GEMINI_MODEL_WRITE: gemini-3.8-flash
      GEMINI_THINKING_BUDGET: 0
      LOG_LEVEL: INFO
    volumes:
      - hf-models:/models

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - ml-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/resume_analyser
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ML_SERVICE_BASE_URL: http://ml-service:8000
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS:?set in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      APP_ADMIN_PATH: ${APP_ADMIN_PATH:?set in deploy/.env}
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
      GITHUB_ISSUES_REPO: ${GITHUB_ISSUES_REPO:-biswas2200/Smart-Resume-Analyzer-and-Job-Recommendation-System}
      JOBS_USER_AGENT: ${JOBS_USER_AGENT:-Coverlay/0.6 (student project; job feed reader)}

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: /api
      BACKEND_URL: http://backend:8080

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  hf-models:
  caddy-data:
  caddy-config:
